# Happy CRM — compose de PRODUCCIÓN.
# Estructura alineada con la documentación oficial de Twenty (self-host con
# Docker Compose): server + worker + db + redis autocontenidos.
# Doc oficial: https://twenty.com/developers/self-host/capabilities/docker-compose
#
# Self-host (igual que la doc oficial):
#   cp .env.example .env   # generar ENCRYPTION_KEY y PG_DATABASE_PASSWORD
#   docker compose up -d --build
#   (usa Postgres/Redis internos; la imagen se construye del target `twenty`,
#   que solo lleva dist compilado + node_modules de producción, NODE_ENV=production)
#
# Imagen prebuilt (p. ej. fallback a upstream sin compilar):
#   docker compose pull && DOCKER_IMAGE=twentycrm/twenty TAG=latest docker compose up -d --no-build
#
# Dokploy con Postgres/Redis externos (los datos de prod viven ahí):
#   composePath = packages/twenty-docker/docker-compose.dokploy.yml
#   (archivo STANDALONE: solo server/worker, sin db/redis internos;
#   no usa `include` porque el compose de Dokploy predates v2.24 y no
#   soporta `!reset`/`!override` para quitar servicios heredados).
#
# Desarrollo local: NO usar este archivo. Usar docker-compose.dev.yml
# (infra db+redis) + `yarn start` desde el código fuente.
name: crm_happy

services:
  server:
    build:
      context: ../..
      dockerfile: packages/twenty-docker/twenty/Dockerfile
      target: twenty
      args:
        # Topes de heap en build (ver Dockerfile). Defaults para host chico
        # compartido; se sobreescriben en el Environment de Dokploy.
        FOCUS_NODE_MEM: ${FOCUS_NODE_MEM:-2048}
        SERVER_BUILD_MEM: ${SERVER_BUILD_MEM:-3072}
        FRONT_BUILD_MEM: ${FRONT_BUILD_MEM:-6144}
    image: ${DOCKER_IMAGE:-happy/crm_happy}:${TAG:-latest}
    # Guardarraíl en runtime: en régimen usa ~770MB, pero el arranque (codegen
    # del schema GraphQL) es el pico de memoria. Sin tope de heap, Node crecía
    # hasta que el kernel mataba el contenedor (OOM) a media línea de log y el
    # deploy entraba en loop sin pasar el healthcheck. Vigilar con docker stats.
    mem_limit: 2048m
    mem_reservation: 768m
    # Techo de CPU: limita bajo contienda, no reserva. Ajustable por Environment.
    cpus: ${SERVER_CPUS:-2}
    ports:
      - "${HOST_PORT:-3000}:3000"
    volumes:
      - server-local-data:/app/packages/twenty-server/.local-storage
    environment:
      NODE_ENV: production
      NODE_PORT: 3000
      # Tope de heap ≈75% del mem_limit: V8 recicla antes de que el cgroup
      # mate el proceso. Aplica también a los command:prod del entrypoint.
      NODE_OPTIONS: ${SERVER_NODE_OPTIONS:---max-old-space-size=1536}
      # Sin PG_DATABASE_URL externo (Dokploy) se usan los servicios internos.
      PG_DATABASE_URL: ${PG_DATABASE_URL:-postgres://${PG_DATABASE_USER:-postgres}:${PG_DATABASE_PASSWORD:-postgres}@${PG_DATABASE_HOST:-db}:${PG_DATABASE_PORT:-5432}/${PG_DATABASE_NAME:-default}}
      SERVER_URL: ${SERVER_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      REDIS_CACHE_PREFIX: ${REDIS_CACHE_PREFIX:-}
      DISABLE_DB_MIGRATIONS: ${DISABLE_DB_MIGRATIONS}
      DISABLE_CRON_JOBS_REGISTRATION: ${DISABLE_CRON_JOBS_REGISTRATION}
      STORAGE_TYPE: ${STORAGE_TYPE}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION}
      STORAGE_S3_NAME: ${STORAGE_S3_NAME}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT}
      STORAGE_S3_ACCESS_KEY_ID: ${STORAGE_S3_ACCESS_KEY_ID}
      STORAGE_S3_SECRET_ACCESS_KEY: ${STORAGE_S3_SECRET_ACCESS_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      FALLBACK_ENCRYPTION_KEY: ${FALLBACK_ENCRYPTION_KEY}
      APP_SECRET: ${APP_SECRET:-}
      IS_BILLING_ENABLED: ${IS_BILLING_ENABLED:-false}
      HAPPY_EDITION: ${HAPPY_EDITION:-community}
      HAPPY_LICENSE_KEY: ${HAPPY_LICENSE_KEY}
      HAPPY_LICENSE_SECRET: ${HAPPY_LICENSE_SECRET}
      HAPPY_MAX_USERS: ${HAPPY_MAX_USERS:-50}
      HAPPY_MAX_WORKSPACES: ${HAPPY_MAX_WORKSPACES:-10}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME}
      EMAIL_DRIVER: ${EMAIL_DRIVER:-LOGGER}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT}
      EMAIL_SMTP_USER: ${EMAIL_SMTP_USER}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: curl --fail http://localhost:3000/healthz
      interval: 5s
      timeout: 5s
      retries: 20
    restart: always

  worker:
    # No build block on purpose: same image as server. A duplicate block
    # would run a second concurrent full build of identical content.
    image: ${DOCKER_IMAGE:-happy/crm_happy}:${TAG:-latest}
    # El worker bootea contexto Nest sin HTTP ni codegen GraphQL (pico menor
    # que el server), pero aplica la misma regla: heap ≈75% del mem_limit.
    mem_limit: 1024m
    mem_reservation: 512m
    cpus: ${WORKER_CPUS:-1}
    volumes:
      - server-local-data:/app/packages/twenty-server/.local-storage
    command: ["yarn", "worker:prod"]
    environment:
      NODE_ENV: production
      NODE_OPTIONS: ${WORKER_NODE_OPTIONS:---max-old-space-size=768}
      PG_DATABASE_URL: ${PG_DATABASE_URL:-postgres://${PG_DATABASE_USER:-postgres}:${PG_DATABASE_PASSWORD:-postgres}@${PG_DATABASE_HOST:-db}:${PG_DATABASE_PORT:-5432}/${PG_DATABASE_NAME:-default}}
      SERVER_URL: ${SERVER_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      REDIS_CACHE_PREFIX: ${REDIS_CACHE_PREFIX:-}
      DISABLE_DB_MIGRATIONS: "true" # it already runs on the server
      DISABLE_CRON_JOBS_REGISTRATION: "true" # it already runs on the server
      STORAGE_TYPE: ${STORAGE_TYPE}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION}
      STORAGE_S3_NAME: ${STORAGE_S3_NAME}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT}
      STORAGE_S3_ACCESS_KEY_ID: ${STORAGE_S3_ACCESS_KEY_ID}
      STORAGE_S3_SECRET_ACCESS_KEY: ${STORAGE_S3_SECRET_ACCESS_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      FALLBACK_ENCRYPTION_KEY: ${FALLBACK_ENCRYPTION_KEY}
      APP_SECRET: ${APP_SECRET:-}
      IS_BILLING_ENABLED: ${IS_BILLING_ENABLED:-false}
      HAPPY_EDITION: ${HAPPY_EDITION:-community}
      HAPPY_LICENSE_KEY: ${HAPPY_LICENSE_KEY}
      HAPPY_LICENSE_SECRET: ${HAPPY_LICENSE_SECRET}
      HAPPY_MAX_USERS: ${HAPPY_MAX_USERS:-50}
      HAPPY_MAX_WORKSPACES: ${HAPPY_MAX_WORKSPACES:-10}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME}
      # El worker procesa EmailSenderJob: sin esto siempre cae a LOGGER.
      EMAIL_DRIVER: ${EMAIL_DRIVER:-LOGGER}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT}
      EMAIL_SMTP_USER: ${EMAIL_SMTP_USER}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
      server:
        condition: service_healthy
    restart: always

  db:
    image: postgres:16
    cpus: ${DB_CPUS:-1}
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${PG_DATABASE_NAME:-default}
      POSTGRES_PASSWORD: ${PG_DATABASE_PASSWORD:-postgres}
      POSTGRES_USER: ${PG_DATABASE_USER:-postgres}
    healthcheck:
      test: pg_isready -U ${PG_DATABASE_USER:-postgres} -h localhost -d postgres
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  redis:
    # Misma versión que la infra de desarrollo (docker-compose.dev.yml).
    image: redis:7
    cpus: ${REDIS_CPUS:-0.5}
    restart: always
    command: ["--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
  server-local-data:
