# Happy CRM — compose de PRODUCCIÓN (único).
# - En Dokploy: composePath = packages/twenty-docker/docker-compose.yml,
#   Postgres/Redis los da Dokploy vía PG_DATABASE_URL / REDIS_URL del Environment.
#   Los tres servicios comparten la red externa dokploy-network.
# - Self-host sin Dokploy: levanta primero la infra con
#     docker compose -f docker-compose.dev.yml up -d
#   y luego este archivo (o pásale PG_DATABASE_URL / REDIS_URL externos).
# Sin dominio: SERVER_URL=http://10.20.50.102:3100 (Dokploy ocupa :3000).
name: crm_happy

services:
  server:
    build:
      context: ../..
      dockerfile: packages/twenty-docker/twenty/Dockerfile
      target: twenty
      args:
        # Topes de heap en build (ver Dockerfile). Defaults para host chico
        # compartido; se sobreescriben en el Environment de Dokploy.
        YARN_FOCUS_MEM: ${YARN_FOCUS_MEM:-2048}
        SERVER_BUILD_MEM: ${SERVER_BUILD_MEM:-3072}
        FRONT_BUILD_MEM: ${FRONT_BUILD_MEM:-4096}
    image: ${DOCKER_IMAGE:-happy/crm_happy}:${TAG:-latest}
    # Guardarraíl en runtime: el server observado usa ~770MB; el límite evita
    # que un pico se lleve al resto de apps del host. Vigilar con docker stats.
    mem_limit: 1536m
    mem_reservation: 768m
    ports:
      - "${HOST_PORT:-3100}:3000"
    volumes:
      - server-local-data:/app/packages/twenty-server/.local-storage
    environment:
      NODE_PORT: 3000
      PG_DATABASE_URL: ${PG_DATABASE_URL}
      SERVER_URL: ${SERVER_URL}
      REDIS_URL: ${REDIS_URL}
      REDIS_CACHE_PREFIX: ${REDIS_CACHE_PREFIX:-}
      DISABLE_DB_MIGRATIONS: ${DISABLE_DB_MIGRATIONS}
      DISABLE_CRON_JOBS_REGISTRATION: ${DISABLE_CRON_JOBS_REGISTRATION}
      STORAGE_TYPE: ${STORAGE_TYPE}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION}
      STORAGE_S3_NAME: ${STORAGE_S3_NAME}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT}
      STORAGE_S3_ACCESS_KEY_ID: ${STORAGE_S3_ACCESS_KEY_ID}
      STORAGE_S3_SECRET_ACCESS_KEY: ${STORAGE_S3_SECRET_ACCESS_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      FALLBACK_ENCRYPTION_KEY: ${FALLBACK_ENCRYPTION_KEY}
      APP_SECRET: ${APP_SECRET:-}
      IS_BILLING_ENABLED: ${IS_BILLING_ENABLED:-false}
      HAPPY_EDITION: ${HAPPY_EDITION:-community}
      HAPPY_LICENSE_KEY: ${HAPPY_LICENSE_KEY}
      HAPPY_LICENSE_SECRET: ${HAPPY_LICENSE_SECRET}
      HAPPY_MAX_USERS: ${HAPPY_MAX_USERS:-50}
      HAPPY_MAX_WORKSPACES: ${HAPPY_MAX_WORKSPACES:-10}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME}
      EMAIL_DRIVER: ${EMAIL_DRIVER}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT}
      EMAIL_SMTP_USER: ${EMAIL_SMTP_USER}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD}
    healthcheck:
      test: curl --fail http://localhost:3000/healthz
      interval: 5s
      timeout: 5s
      retries: 20
    restart: always
    networks:
      - dokploy-network

  worker:
    image: ${DOCKER_IMAGE:-happy/crm_happy}:${TAG:-latest}
    mem_limit: 1024m
    mem_reservation: 512m
    volumes:
      - server-local-data:/app/packages/twenty-server/.local-storage
    command: ["yarn", "worker:prod"]
    environment:
      PG_DATABASE_URL: ${PG_DATABASE_URL}
      SERVER_URL: ${SERVER_URL}
      REDIS_URL: ${REDIS_URL}
      REDIS_CACHE_PREFIX: ${REDIS_CACHE_PREFIX:-}
      DISABLE_DB_MIGRATIONS: "true" # it already runs on the server
      DISABLE_CRON_JOBS_REGISTRATION: "true" # it already runs on the server
      STORAGE_TYPE: ${STORAGE_TYPE}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION}
      STORAGE_S3_NAME: ${STORAGE_S3_NAME}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT}
      STORAGE_S3_ACCESS_KEY_ID: ${STORAGE_S3_ACCESS_KEY_ID}
      STORAGE_S3_SECRET_ACCESS_KEY: ${STORAGE_S3_SECRET_ACCESS_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      FALLBACK_ENCRYPTION_KEY: ${FALLBACK_ENCRYPTION_KEY}
      APP_SECRET: ${APP_SECRET:-}
    depends_on:
      server:
        condition: service_healthy
    restart: always
    networks:
      - dokploy-network

volumes:
  server-local-data:

networks:
  dokploy-network:
    external: true
