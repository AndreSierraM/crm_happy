# Happy CRM — overlay de PRODUCCIÓN para Dokploy.
# Incluye el compose de prod autocontenido (docker-compose.yml) y lo adapta a
# Dokploy con Postgres/Redis EXTERNOS (los datos de prod viven ahí):
#  - server/worker se unen a la red externa dokploy-network para resolver los
#    hostnames de las bases de Dokploy por DNS interno;
#  - db/redis internos se desactivan (profile `self-host`, nunca activo aquí);
#  - PG_DATABASE_URL / REDIS_URL del Environment de Dokploy son obligatorios
#    (fallo temprano y explícito si faltan, en vez de apuntar a `db`/`redis`
#    internos que aquí no existen).
#
# En Dokploy: composePath = packages/twenty-docker/docker-compose.dokploy.yml
# Requiere docker compose >= 2.24 por el `!reset`/`!override` de depends_on.
# `name` se repite aquí: con `include`, el nombre del archivo incluido se ignora
# y sin esto los volúmenes/contenedores cambiarían de prefijo (datos huérfanos).
name: crm_happy

include:
  - ./docker-compose.yml

services:
  db:
    profiles: ["self-host"]

  redis:
    profiles: ["self-host"]

  server:
    depends_on: !reset {}
    ports:
      - "${HOST_PORT:-3100}:3000"
    environment:
      PG_DATABASE_URL: ${PG_DATABASE_URL:?PG_DATABASE_URL debe venir del Environment de Dokploy (Postgres externo)}
      REDIS_URL: ${REDIS_URL:?REDIS_URL debe venir del Environment de Dokploy (Redis externo)}
    networks:
      - dokploy-network

  worker:
    depends_on: !override {server: {condition: service_healthy}}
    environment:
      PG_DATABASE_URL: ${PG_DATABASE_URL:?PG_DATABASE_URL debe venir del Environment de Dokploy (Postgres externo)}
      REDIS_URL: ${REDIS_URL:?REDIS_URL debe venir del Environment de Dokploy (Redis externo)}
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
